        /* Custom Animations & Decorative Styles */
        @keyframes floatSlow {

        }
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }

        /* -------------------------------------------------------------------
        2. BACKGROUND MUSIC MP3
        ------------------------------------------------------------------- */
        const bgMusic = document.getElementById('bgMusic');
        const musicIcon = document.getElementById('music-icon');
        let isPlaying = false;

        function startMusic() {
            if (!bgMusic) return;
            bgMusic.play().then(() => {
                isPlaying = true;
                musicIcon?.classList.add('animate-spin-slow');
            }).catch((err) => {
                console.warn('Audio gagal diputar:', err);
            });
        }

        function stopMusic() {
            if (!bgMusic) return;
            bgMusic.pause();
            isPlaying = false;
            musicIcon?.classList.remove('animate-spin-slow');
        }

        document.getElementById('music-toggle-btn')?.addEventListener('click', () => {
            if (isPlaying) {
                stopMusic();
                showToast('Musik latar dijeda');
            } else {
                startMusic();
                showToast('Memutar musik latar');
            }
        });


        /* -------------------------------------------------------------------
           3. COVER OPENING TRANSITION
        ------------------------------------------------------------------- */
        document.getElementById('open-invitation-btn').addEventListener('click', () => {
            const cover = document.getElementById('invitation-cover');
            cover.classList.add('-translate-y-full', 'opacity-0', 'pointer-events-none');
            startMusic();
            setTimeout(() => {
                cover.style.display = 'none';
            }, 1000);
        });

        /* -------------------------------------------------------------------
           4. COUNTDOWN TIMER (TARGET: 16 JANUARI 2027 08:00 WIB)
        ------------------------------------------------------------------- */
        function startCountdown() {
            const targetDate = new Date('2027-01-16T08:00:00+07:00').getTime();

            function updateTimer() {
                const now = new Date().getTime();
                const distance = targetDate - now;

                if (distance <= 0) {
                    document.getElementById('cd-days').textContent = '00';
                    document.getElementById('cd-hours').textContent = '00';
                    document.getElementById('cd-minutes').textContent = '00';
                    document.getElementById('cd-seconds').textContent = '00';
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
                document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
                document.getElementById('cd-minutes').textContent = String(minutes).padStart(2, '0');
                document.getElementById('cd-seconds').textContent = String(seconds).padStart(2, '0');
            }

            updateTimer();
            setInterval(updateTimer, 1000);
        }

        /* -------------------------------------------------------------------
           5. DOWNLOAD CALENDAR (.ICS FILE GENERATOR)
        ------------------------------------------------------------------- */
        function downloadICS(title, startDateTime, endDateTime, location) {
            const icsContent = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//Hyosop & Mega Wedding//ID',
                'BEGIN:VEVENT',
                `DTSTART:${startDateTime}`,
                `DTEND:${endDateTime}`,
                `SUMMARY:${title}`,
                `LOCATION:${location}`,
                'DESCRIPTION:Undangan Pernikahan Ahn Hyo Seop & Eva Mega Putri',
                'END:VEVENT',
                'END:VCALENDAR'
            ].join('\r\n');

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', `${title.replace(/\s+/g, '_')}.ics`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showToast('File kalender (.ics) berhasil diunduh!');
        }

        /* -------------------------------------------------------------------

        ------------------------------------------------------------------- */
        function openLightbox(element) {
            const imgSrc = element.querySelector('img').src;
            const modal = document.getElementById('lightbox-modal');
            const modalImg = document.getElementById('lightbox-img');
            modalImg.src = imgSrc;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeLightbox() {
            const modal = document.getElementById('lightbox-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        /* -------------------------------------------------------------------
           7. COPY BANK ACCOUNT WITH TOAST NOTIFICATION
        ------------------------------------------------------------------- */
        function copyAccount(accountNumber, label) {
            const tempInput = document.createElement('textarea');
            tempInput.value = accountNumber;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand('copy');
                showToast(`${label} berhasil disalin!`);
            } catch (err) {
                showToast('Gagal menyalin nomor rekening');
            }
            document.body.removeChild(tempInput);
        }

        let toastTimeout = null;
        function showToast(message) {
            const toast = document.getElementById('toast-notification');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.textContent = message;

            toast.classList.remove('opacity-0', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-4');
            }, 2800);
        }

                        <div class="flex items-center gap-2">
                            <span class="font-semibold text-sm text-espresso-900">${escapeHTML(item.name)}</span>
                            <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-medium ${badgeClass}">
                                <i class="fa-solid ${iconClass}"></i> ${escapeHTML(item.status)}
                            </span>
                        </div>
                        <span class="text-[11px] text-espresso-800/60">${escapeHTML(item.time)}</span>
                    </div>
                    <p class="text-xs sm:text-sm text-espresso-800/85 leading-relaxed">${escapeHTML(item.message)}</p>
                `;
                container.appendChild(card);
            });
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        document.getElementById('rsvp-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('sender-name');
            const statusInput = document.getElementById('attendance-status');
            const countInput = document.getElementById('guest-count');
            const messageInput = document.getElementById('wish-message');

            const newWish = {
                name: nameInput.value.trim(),
                status: statusInput.value,
                guests: countInput.value,
                message: messageInput.value.trim(),
                time: 'Baru saja'
            };

            const wishes = loadWishes();
            wishes.unshift(newWish);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(wishes));

            renderWishes();
            messageInput.value = '';
            showToast('Terima kasih! Ucapan & konfirmasi Anda telah terkirim.');
        });

        /* -------------------------------------------------------------------
           9. SCROLL REVEAL OBSERVER
        ------------------------------------------------------------------- */
        function initScrollReveal() {
            const reveals = document.querySelectorAll('.reveal');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                    }
                });
            }, { threshold: 0.12 });

            reveals.forEach((el) => observer.observe(el));
        }

        /* -------------------------------------------------------------------
           INITIALIZATION ON DOM LOADED
        ------------------------------------------------------------------- */
        document.addEventListener('DOMContentLoaded', () => {
            initGuestName();
            startCountdown();
            renderWishes();
            initScrollReveal();
        });
    </script>
</body>
</html>
